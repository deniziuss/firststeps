# FirstSteps behind nginx (PREPARED, NOT DEPLOYED). Certificates are issued separately (for example with
# certbot). The app listens only on 127.0.0.1:3000; SQL Server stays on a private network.
# App environment: DEPLOYMENT=public, APP_URL=https://firststeps.example, TRUST_PROXY=true, TRUST_PROXY_HOPS=1

server {
    listen 80;
    listen [::]:80;
    server_name firststeps.example;
    return 308 https://firststeps.example$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name firststeps.example;

    ssl_certificate     /etc/letsencrypt/live/firststeps.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/firststeps.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    server_tokens off;

    client_max_body_size 1m;
    client_body_timeout 30s;
    client_header_timeout 10s;
    keepalive_timeout 75s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # Overwrite the forwarding headers with values nginx knows; never pass client-supplied ones on.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Request-ID      $request_id;
        proxy_set_header Connection        "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}

# Requests for any other host name are closed without an answer.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}
